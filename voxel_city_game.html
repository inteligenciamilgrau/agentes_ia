<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel City - Jogo de Entrega 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
        }
        #minimap {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0,0,0,0.7);
            border: 3px solid #fff;
            border-radius: 10px;
            z-index: 100;
        }
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 100;
        }
        #message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffff00;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.9);
            z-index: 101;
            display: none;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
        }
        #speedometer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            display: none;
            z-index: 100;
        }
        .gauge {
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            border-radius: 50%;
            border: 5px solid #fff;
            position: relative;
        }
        .gauge-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
        }
        .gauge-needle {
            position: absolute;
            bottom: 50%;
            left: 50%;
            width: 3px;
            height: 50px;
            background: #ff0000;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-135deg);
            transition: transform 0.2s ease;
        }
        .gauge-label {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div>Pontos: <span id="score">0</span></div>
        <div>Tempo: <span id="timer">60</span>s</div>
        <div>Status: <span id="status">Procure o objeto!</span></div>
        <div id="carStatus" style="display:none;">No carro - ESPAÇO para sair</div>
    </div>
    <div id="minimap"></div>
    <div id="speedometer">
        <div class="gauge">
            <div class="gauge-needle" id="needle"></div>
            <div class="gauge-center"></div>
            <div class="gauge-label"><span id="speed">0</span> km/h</div>
        </div>
    </div>
    <div id="instructions">
        WASD: Mover | Mouse: Olhar | Scroll: Zoom | ESPAÇO: Entrar/Sair | V: Mudar visão | E/Click: Atirar | ESC: Liberar mouse
    </div>
    <div id="message"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ==================== CONFIGURAÇÃO INICIAL ====================
        let scene, camera, renderer;
        let player, playerVoxel;
        let keys = {};
        let isInCar = false;
        let currentCar = null;
        let carInternalView = true;
        let mouseX = 0, mouseY = 0;
        let cameraDistance = 15;
        let cameraHeight = 8;
        let score = 0;
        let timeLeft = 60;
        let gameActive = true;
        let carSpeed = 0;
        let bullets = [];
        let explosions = [];

        // Objetos do jogo
        let buildings = [];
        let cars = [];
        let npcs = [];
        let trafficLights = [];
        let streetLights = [];
        let trees = [];

        // Missão
        let pickupObject = null;
        let deliveryNPC = null;
        let hasObject = false;
        let pickupNPC = null;

        // Dia/Noite
        let dayNightCycle = 0;
        let sun, moon;

        // Pointer Lock
        let isPointerLocked = false;

        // Minimap
        let minimapRenderer, minimapCamera, minimapScene;

        // ==================== INICIALIZAÇÃO ====================
        function init() {
            // Configurar cena
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x87CEEB, 50, 300);

            // Configurar câmera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, cameraHeight, cameraDistance);

            // Configurar renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = false; // Desabilitado para otimização
            document.body.appendChild(renderer.domElement);

            // Luz ambiente (ajustada para compensar ausência de sombras)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            ambientLight.name = 'ambientLight';
            scene.add(ambientLight);

            // Sol (luz direcional)
            sun = new THREE.DirectionalLight(0xffffcc, 0.8);
            sun.position.set(50, 100, 50);
            sun.castShadow = false;
            scene.add(sun);

            // Lua
            moon = new THREE.DirectionalLight(0x6666ff, 0.3);
            moon.position.set(-50, 100, -50);
            scene.add(moon);

            // Criar mundo
            createGround();
            createCity();
            createPlayer();
            createNPCs();
            createCars();
            createTrafficLights();
            createStreetLights();
            createTrees();
            createMission();

            // Configurar minimap
            setupMinimap();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', onMouseClick);
            document.addEventListener('wheel', onMouseWheel);
            document.addEventListener('click', requestPointerLock);
            document.addEventListener('pointerlockchange', onPointerLockChange);

            // Iniciar timer
            setInterval(updateTimer, 1000);

            // Iniciar animação
            animate();
        }

        // ==================== CRIAÇÃO DE VOXELS ====================
        function createVoxel(x, y, z, size, color, shadows = false) {
            const geometry = new THREE.BoxGeometry(size, size, size);
            const material = new THREE.MeshLambertMaterial({ color: color });
            const voxel = new THREE.Mesh(geometry, material);
            voxel.position.set(x, y, z);
            voxel.castShadow = shadows;
            voxel.receiveShadow = shadows;
            return voxel;
        }

        function createVoxelGroup(voxels) {
            const group = new THREE.Group();
            voxels.forEach(v => {
                const voxel = createVoxel(v.x, v.y, v.z, v.size, v.color);
                group.add(voxel);
            });
            return group;
        }

        // ==================== CHÃO E RUAS ====================
        function createGround() {
            const citySize = 200;

            // Chão base
            const groundGeometry = new THREE.PlaneGeometry(citySize, citySize);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Criar ruas com faixas
            createStreets();
        }

        function createStreets() {
            const streetWidth = 8;
            const positions = [-60, -30, 0, 30, 60];

            // Ruas horizontais
            positions.forEach(z => {
                const street = new THREE.Mesh(
                    new THREE.PlaneGeometry(200, streetWidth),
                    new THREE.MeshLambertMaterial({ color: 0x333333 })
                );
                street.rotation.x = -Math.PI / 2;
                street.position.set(0, 0.05, z);
                street.receiveShadow = true;
                scene.add(street);

                // Faixas amarelas no meio da rua
                for (let x = -100; x < 100; x += 8) {
                    const line = new THREE.Mesh(
                        new THREE.PlaneGeometry(4, 0.3),
                        new THREE.MeshLambertMaterial({ color: 0xffff00 })
                    );
                    line.rotation.x = -Math.PI / 2;
                    line.position.set(x, 0.1, z);
                    scene.add(line);
                }

                // Faixas de pedestres
                for (let i = 0; i < 3; i++) {
                    const crosswalkX = -50 + i * 50;
                    for (let strip = 0; strip < 8; strip++) {
                        if (strip % 2 === 0) {
                            const stripe = new THREE.Mesh(
                                new THREE.PlaneGeometry(3, 1),
                                new THREE.MeshLambertMaterial({ color: 0xffffff })
                            );
                            stripe.rotation.x = -Math.PI / 2;
                            stripe.position.set(crosswalkX, 0.11, z - 4 + strip);
                            scene.add(stripe);
                        }
                    }
                }
            });

            // Ruas verticais
            positions.forEach(x => {
                const street = new THREE.Mesh(
                    new THREE.PlaneGeometry(streetWidth, 200),
                    new THREE.MeshLambertMaterial({ color: 0x333333 })
                );
                street.rotation.x = -Math.PI / 2;
                street.position.set(x, 0.05, 0);
                street.receiveShadow = true;
                scene.add(street);

                // Faixas amarelas
                for (let z = -100; z < 100; z += 8) {
                    const line = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.3, 4),
                        new THREE.MeshLambertMaterial({ color: 0xffff00 })
                    );
                    line.rotation.x = -Math.PI / 2;
                    line.position.set(x, 0.1, z);
                    scene.add(line);
                }

                // Faixas de pedestres
                for (let i = 0; i < 3; i++) {
                    const crosswalkZ = -50 + i * 50;
                    for (let strip = 0; strip < 8; strip++) {
                        if (strip % 2 === 0) {
                            const stripe = new THREE.Mesh(
                                new THREE.PlaneGeometry(1, 3),
                                new THREE.MeshLambertMaterial({ color: 0xffffff })
                            );
                            stripe.rotation.x = -Math.PI / 2;
                            stripe.position.set(x - 4 + strip, 0.11, crosswalkZ);
                            scene.add(stripe);
                        }
                    }
                }
            });

            // Calçadas
            createSidewalks();
        }

        function createSidewalks() {
            const positions = [-64, -34, -4, 26, 56, 86];

            positions.forEach((x, i) => {
                if (i < positions.length - 1) {
                    // Calçadas horizontais
                    [-64, -34, -4, 26, 56].forEach(z => {
                        const sidewalk = new THREE.Mesh(
                            new THREE.BoxGeometry(positions[i + 1] - x - 8, 0.5, 3),
                            new THREE.MeshLambertMaterial({ color: 0xcccccc })
                        );
                        sidewalk.position.set((x + positions[i + 1]) / 2, 0.25, z - 5.5);
                        sidewalk.castShadow = true;
                        sidewalk.receiveShadow = true;
                        scene.add(sidewalk);

                        const sidewalk2 = new THREE.Mesh(
                            new THREE.BoxGeometry(positions[i + 1] - x - 8, 0.5, 3),
                            new THREE.MeshLambertMaterial({ color: 0xcccccc })
                        );
                        sidewalk2.position.set((x + positions[i + 1]) / 2, 0.25, z + 5.5);
                        sidewalk2.castShadow = true;
                        sidewalk2.receiveShadow = true;
                        scene.add(sidewalk2);
                    });
                }
            });
        }

        // ==================== CIDADE ====================
        function createCity() {
            const buildingPositions = [
                // Quarteirão 1
                { x: -75, z: -75 }, { x: -50, z: -75 }, { x: -75, z: -50 },
                // Quarteirão 2
                { x: -15, z: -75 }, { x: 10, z: -75 }, { x: -15, z: -50 },
                // Quarteirão 3
                { x: 45, z: -75 }, { x: 70, z: -75 }, { x: 45, z: -50 },
                // Quarteirão 4
                { x: -75, z: -15 }, { x: -50, z: -15 }, { x: -75, z: 10 },
                // Quarteirão 5
                { x: -15, z: -15 }, { x: 10, z: -15 }, { x: -15, z: 10 },
                // Quarteirão 6
                { x: 45, z: -15 }, { x: 70, z: -15 }, { x: 45, z: 10 },
                // Quarteirão 7
                { x: -75, z: 45 }, { x: -50, z: 45 }, { x: -75, z: 70 },
                // Quarteirão 8
                { x: -15, z: 45 }, { x: 10, z: 45 }, { x: -15, z: 70 },
                // Quarteirão 9
                { x: 45, z: 45 }, { x: 70, z: 45 }, { x: 45, z: 70 }
            ];

            buildingPositions.forEach(pos => {
                createBuilding(pos.x, pos.z);
            });
        }

        function createBuilding(x, z) {
            const height = 15 + Math.random() * 25;
            const width = 10 + Math.random() * 8;
            const depth = 10 + Math.random() * 8;

            const colors = [0x8B4513, 0xA0522D, 0x696969, 0x708090, 0x4682B4];
            const color = colors[Math.floor(Math.random() * colors.length)];

            // Corpo do prédio
            const building = new THREE.Mesh(
                new THREE.BoxGeometry(width, height, depth),
                new THREE.MeshLambertMaterial({ color: color })
            );
            building.position.set(x, height / 2, z);
            building.castShadow = false; // Otimização
            building.receiveShadow = false;
            scene.add(building);

            // Janelas (reduzidas para otimização)
            const windowSize = 1.2;
            const windowSpacing = 3.5;
            const floors = Math.floor(height / 4);

            // Material compartilhado para janelas
            const windowMaterial = new THREE.MeshLambertMaterial({
                color: 0xffffaa,
                emissive: 0xffffaa,
                emissiveIntensity: 0.2
            });

            for (let floor = 1; floor < floors; floor++) {
                const y = floor * 4;

                // Janelas na frente (reduzidas)
                for (let i = -Math.floor(width / 7); i <= Math.floor(width / 7); i++) {
                    if (i % 2 === 0) {
                        const window1 = new THREE.Mesh(
                            new THREE.BoxGeometry(windowSize, windowSize, 0.2),
                            windowMaterial
                        );
                        window1.position.set(x + i * windowSpacing, y, z + depth / 2 + 0.1);
                        scene.add(window1);
                    }
                }

                // Janelas nas laterais (apenas algumas)
                if (floor % 2 === 0) {
                    for (let i = -1; i <= 1; i++) {
                        const window3 = new THREE.Mesh(
                            new THREE.BoxGeometry(0.2, windowSize, windowSize),
                            windowMaterial
                        );
                        window3.position.set(x + width / 2 + 0.1, y, z + i * windowSpacing);
                        scene.add(window3);

                        const window4 = new THREE.Mesh(
                            new THREE.BoxGeometry(0.2, windowSize, windowSize),
                            windowMaterial
                        );
                        window4.position.set(x - width / 2 - 0.1, y, z + i * windowSpacing);
                        scene.add(window4);
                    }
                }
            }

            buildings.push({ mesh: building, x, z, width, depth });
        }

        // ==================== JOGADOR ====================
        function createPlayer() {
            playerVoxel = createPlayerVoxel();
            playerVoxel.position.set(0, 0, 0);
            scene.add(playerVoxel);

            player = {
                mesh: playerVoxel,
                position: new THREE.Vector3(0, 0, 0),
                velocity: new THREE.Vector3(0, 0, 0),
                speed: 0.15,
                rotation: 0,
                walkAnimation: 0
            };
        }

        function createPlayerVoxel() {
            const group = new THREE.Group();

            // Corpo
            const body = createVoxel(0, 2.5, 0, 1.5, 0x0066ff);
            group.add(body);

            // Cabeça
            const head = createVoxel(0, 3.8, 0, 1.2, 0xffdbac);
            group.add(head);

            // Braço esquerdo
            const leftArm = createVoxel(-1.2, 2.5, 0, 0.6, 0xffdbac);
            leftArm.name = 'leftArm';
            group.add(leftArm);

            // Braço direito
            const rightArm = createVoxel(1.2, 2.5, 0, 0.6, 0xffdbac);
            rightArm.name = 'rightArm';
            group.add(rightArm);

            // Perna esquerda
            const leftLeg = createVoxel(-0.4, 1.2, 0, 0.6, 0x333333);
            leftLeg.name = 'leftLeg';
            group.add(leftLeg);

            // Perna direita
            const rightLeg = createVoxel(0.4, 1.2, 0, 0.6, 0x333333);
            rightLeg.name = 'rightLeg';
            group.add(rightLeg);

            return group;
        }

        // ==================== NPCs ====================
        function createNPCs() {
            const npcCount = 15;
            const walkPaths = [
                { start: { x: -80, z: -60 }, end: { x: 80, z: -60 } },
                { start: { x: -80, z: -30 }, end: { x: 80, z: -30 } },
                { start: { x: -80, z: 0 }, end: { x: 80, z: 0 } },
                { start: { x: -80, z: 30 }, end: { x: 80, z: 30 } },
                { start: { x: -80, z: 60 }, end: { x: 80, z: 60 } },
                { start: { x: -60, z: -80 }, end: { x: -60, z: 80 } },
                { start: { x: -30, z: -80 }, end: { x: -30, z: 80 } },
                { start: { x: 0, z: -80 }, end: { x: 0, z: 80 } },
                { start: { x: 30, z: -80 }, end: { x: 30, z: 80 } },
                { start: { x: 60, z: -80 }, end: { x: 60, z: 80 } }
            ];

            for (let i = 0; i < npcCount; i++) {
                const path = walkPaths[Math.floor(Math.random() * walkPaths.length)];
                const progress = Math.random();
                const x = path.start.x + (path.end.x - path.start.x) * progress;
                const z = path.start.z + (path.end.z - path.start.z) * progress;

                const npcMesh = createNPCVoxel();
                npcMesh.position.set(x, 0, z);
                scene.add(npcMesh);

                npcs.push({
                    mesh: npcMesh,
                    path: path,
                    progress: progress,
                    speed: 0.002 + Math.random() * 0.002,
                    forward: Math.random() > 0.5,
                    walkAnimation: Math.random() * Math.PI * 2
                });
            }
        }

        function createNPCVoxel() {
            const group = new THREE.Group();

            const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff, 0xffa500];
            const color = colors[Math.floor(Math.random() * colors.length)];

            // Corpo
            const body = createVoxel(0, 2.5, 0, 1.5, color);
            group.add(body);

            // Cabeça
            const head = createVoxel(0, 3.8, 0, 1.2, 0xffdbac);
            group.add(head);

            // Braços
            const leftArm = createVoxel(-1.2, 2.5, 0, 0.6, 0xffdbac);
            leftArm.name = 'leftArm';
            group.add(leftArm);

            const rightArm = createVoxel(1.2, 2.5, 0, 0.6, 0xffdbac);
            rightArm.name = 'rightArm';
            group.add(rightArm);

            // Pernas
            const leftLeg = createVoxel(-0.4, 1.2, 0, 0.6, 0x333333);
            leftLeg.name = 'leftLeg';
            group.add(leftLeg);

            const rightLeg = createVoxel(0.4, 1.2, 0, 0.6, 0x333333);
            rightLeg.name = 'rightLeg';
            group.add(rightLeg);

            return group;
        }

        // ==================== CARROS ====================
        function createCars() {
            // Mão direita: carros andam no lado direito da rua
            const carPaths = [
                // Ruas horizontais (eixo X)
                { start: { x: -90, z: -62 }, end: { x: 90, z: -62 }, axis: 'x', lane: 'right' },
                { start: { x: 90, z: -58 }, end: { x: -90, z: -58 }, axis: 'x', lane: 'left' },
                { start: { x: -90, z: -32 }, end: { x: 90, z: -32 }, axis: 'x', lane: 'right' },
                { start: { x: 90, z: -28 }, end: { x: -90, z: -28 }, axis: 'x', lane: 'left' },
                { start: { x: -90, z: -2 }, end: { x: 90, z: -2 }, axis: 'x', lane: 'right' },
                { start: { x: 90, z: 2 }, end: { x: -90, z: 2 }, axis: 'x', lane: 'left' },
                { start: { x: -90, z: 28 }, end: { x: 90, z: 28 }, axis: 'x', lane: 'right' },
                { start: { x: 90, z: 32 }, end: { x: -90, z: 32 }, axis: 'x', lane: 'left' },
                { start: { x: -90, z: 58 }, end: { x: 90, z: 58 }, axis: 'x', lane: 'right' },
                { start: { x: 90, z: 62 }, end: { x: -90, z: 62 }, axis: 'x', lane: 'left' },
                // Ruas verticais (eixo Z)
                { start: { x: -62, z: -90 }, end: { x: -62, z: 90 }, axis: 'z', lane: 'right' },
                { start: { x: -58, z: 90 }, end: { x: -58, z: -90 }, axis: 'z', lane: 'left' },
                { start: { x: -32, z: -90 }, end: { x: -32, z: 90 }, axis: 'z', lane: 'right' },
                { start: { x: -28, z: 90 }, end: { x: -28, z: -90 }, axis: 'z', lane: 'left' },
                { start: { x: -2, z: -90 }, end: { x: -2, z: 90 }, axis: 'z', lane: 'right' },
                { start: { x: 2, z: 90 }, end: { x: 2, z: -90 }, axis: 'z', lane: 'left' },
                { start: { x: 28, z: -90 }, end: { x: 28, z: 90 }, axis: 'z', lane: 'right' },
                { start: { x: 32, z: 90 }, end: { x: 32, z: -90 }, axis: 'z', lane: 'left' },
                { start: { x: 58, z: -90 }, end: { x: 58, z: 90 }, axis: 'z', lane: 'right' },
                { start: { x: 62, z: 90 }, end: { x: 62, z: -90 }, axis: 'z', lane: 'left' }
            ];

            for (let i = 0; i < 12; i++) {
                const path = carPaths[Math.floor(Math.random() * carPaths.length)];
                const progress = Math.random();
                const x = path.start.x + (path.end.x - path.start.x) * progress;
                const z = path.start.z + (path.end.z - path.start.z) * progress;

                const carMesh = createCarVoxel();
                carMesh.position.set(x, 0, z);

                if (path.axis === 'z') {
                    carMesh.rotation.y = Math.PI / 2;
                }
                if (path.end.x < path.start.x || path.end.z < path.start.z) {
                    carMesh.rotation.y += Math.PI;
                }

                scene.add(carMesh);

                cars.push({
                    mesh: carMesh,
                    path: path,
                    progress: progress,
                    speed: 0.003 + Math.random() * 0.002,
                    waiting: false,
                    waitTime: 0
                });
            }
        }

        function createCarVoxel() {
            const group = new THREE.Group();

            const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff6600, 0x00ffff];
            const color = colors[Math.floor(Math.random() * colors.length)];

            // Corpo do carro
            const body = createVoxel(0, 1.5, 0, 3, color);
            body.scale.set(1.5, 0.6, 1);
            group.add(body);

            // Teto
            const roof = createVoxel(0, 2.3, -0.2, 2, color);
            roof.scale.set(1, 0.8, 0.8);
            group.add(roof);

            // Janelas
            const windowColor = 0x88ccff;
            const frontWindow = createVoxel(0, 2.3, 0.8, 1.8, windowColor);
            frontWindow.scale.set(0.9, 0.7, 0.1);
            group.add(frontWindow);

            const backWindow = createVoxel(0, 2.3, -1.2, 1.8, windowColor);
            backWindow.scale.set(0.9, 0.7, 0.1);

            // Rodas
            const wheelColor = 0x222222;
            const wheel1 = createVoxel(-1.5, 0.5, 1, 0.8, wheelColor);
            const wheel2 = createVoxel(1.5, 0.5, 1, 0.8, wheelColor);
            const wheel3 = createVoxel(-1.5, 0.5, -1, 0.8, wheelColor);

        // ==================== SEMÁFOROS ====================
        function createTrafficLights() {
            const intersections = [
                { x: -60, z: -60 }, { x: -60, z: -30 }, { x: -60, z: 0 }, { x: -60, z: 30 }, { x: -60, z: 60 },
                { x: -30, z: -60 }, { x: -30, z: -30 }, { x: -30, z: 0 }, { x: -30, z: 30 }, { x: -30, z: 60 },
                { x: 0, z: -60 }, { x: 0, z: -30 }, { x: 0, z: 0 }, { x: 0, z: 30 }, { x: 0, z: 60 },
                { x: 30, z: -60 }, { x: 30, z: -30 }, { x: 30, z: 0 }, { x: 30, z: 30 }, { x: 30, z: 60 },
                { x: 60, z: -60 }, { x: 60, z: -30 }, { x: 60, z: 0 }, { x: 60, z: 30 }, { x: 60, z: 60 }
            ];

            intersections.forEach((pos, index) => {
                const light = createTrafficLight(pos.x + 5, pos.z + 5);
                scene.add(light);

                trafficLights.push({
                    mesh: light,
                    state: index % 2 === 0 ? 'red' : 'green',
                    timer: 0,
                    x: pos.x,
                    z: pos.z
                });
            });
        }

        function createTrafficLight(x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            // Poste
            const pole = createVoxel(0, 3, 0, 0.4, 0x444444);
            pole.scale.set(1, 8, 1);
            group.add(pole);

            // Caixa do semáforo
            const box = createVoxel(0, 6, 0, 1.2, 0x333333);
            box.scale.set(0.8, 1.5, 0.6);
            group.add(box);

            // Luzes
            const redLight = createVoxel(0, 6.8, 0.4, 0.5, 0x440000);

            group.add(redLight);

            const yellowLight = createVoxel(0, 6, 0.4, 0.5, 0x444400);
            yellowLight.name = 'yellow';
            group.add(yellowLight);

            const greenLight = createVoxel(0, 5.2, 0.4, 0.5, 0x004400);

        // ==================== POSTES DE ILUMINAÇÃO ====================
        function createStreetLights() {
            const positions = [];

            // Postes ao longo das ruas (reduzido para otimização)
            for (let x = -80; x <= 80; x += 40) {
                for (let z = -80; z <= 80; z += 40) {
                    if (Math.abs(x % 30) < 5 || Math.abs(z % 30) < 5) {
                        positions.push({ x, z });
                    }
                }
            }

            // Limitar número de luzes pontuais
            positions.forEach((pos, index) => {
                const light = createStreetLight(pos.x, pos.z, index < 8);
                scene.add(light);
                streetLights.push(light);
            });
        }

        function createStreetLight(x, z, addPointLight = false) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            // Poste
            const pole = createVoxel(0, 4, 0, 0.3, 0x666666);
            pole.scale.set(1, 12, 1);
            group.add(pole);

            // Braço
            const arm = createVoxel(0.8, 7.5, 0, 0.2, 0x666666);
            arm.scale.set(6, 1, 1);
            group.add(arm);

            // Lâmpada
            const lamp = createVoxel(1.5, 7, 0, 0.8, 0xffffaa);
            lamp.name = 'lamp';
            group.add(lamp);

            // Adicionar luz pontual apenas em alguns postes
            if (addPointLight) {
                const pointLight = new THREE.PointLight(0xffffaa, 0.5, 40);
                pointLight.position.set(1.5, 7, 0);
                pointLight.castShadow = false; // Desabilitar sombras para otimização
                group.add(pointLight);
            }

            return group;
        }

        // ==================== ÁRVORES ====================
        function createTrees() {
            const treePositions = [];

            // Árvores nas calçadas
            for (let x = -85; x <= 85; x += 15) {
                for (let z = -85; z <= 85; z += 15) {
                    // Evitar árvores nas ruas
                    const onStreet =
                        (Math.abs(x + 60) < 4 || Math.abs(x + 30) < 4 || Math.abs(x) < 4 || Math.abs(x - 30) < 4 || Math.abs(x - 60) < 4) ||
                        (Math.abs(z + 60) < 4 || Math.abs(z + 30) < 4 || Math.abs(z) < 4 || Math.abs(z - 30) < 4 || Math.abs(z - 60) < 4);

                    if (!onStreet && Math.random() > 0.5) {
                        treePositions.push({ x, z });
                    }
                }
            }

            treePositions.forEach(pos => {
                const tree = createTree(pos.x, pos.z);
                scene.add(tree);
                trees.push(tree);
            });
        }

        function createTree(x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            // Tronco
            const trunk = createVoxel(0, 2, 0, 0.6, 0x8B4513);
            trunk.scale.set(1, 4, 1);
            group.add(trunk);

            // Copa (folhas)
            const foliage = createVoxel(0, 5, 0, 3, 0x228B22);
            group.add(foliage);

            const foliage2 = createVoxel(0, 6.5, 0, 2.5, 0x228B22);
            group.add(foliage2);

            const foliage3 = createVoxel(0, 7.8, 0, 1.8, 0x228B22);
            group.add(foliage3);

            return group;
        }

        // ==================== MISSÃO ====================
        function createMission() {
            // Selecionar NPC aleatório para ter o objeto
            const pickupIndex = Math.floor(Math.random() * npcs.length);
            pickupNPC = npcs[pickupIndex];

            // Criar objeto sobre o NPC
            pickupObject = createVoxel(0, 6, 0, 0.8, 0xffff00);
            pickupObject.material.emissive = new THREE.Color(0xffff00);
            pickupObject.material.emissiveIntensity = 0.5;
            pickupNPC.mesh.add(pickupObject);

            // Selecionar NPC diferente para entrega
            let deliveryIndex;
            do {
                deliveryIndex = Math.floor(Math.random() * npcs.length);
            } while (deliveryIndex === pickupIndex);

            deliveryNPC = npcs[deliveryIndex];

            // Criar marcador sobre NPC de entrega
            const marker = createVoxel(0, 6, 0, 0.8, 0x00ff00);
            marker.material.emissive = new THREE.Color(0x00ff00);
            marker.material.emissiveIntensity = 0.5;
            marker.name = 'deliveryMarker';
            deliveryNPC.mesh.add(marker);
        }

        function nextMission() {
            // Remover objetos antigos
            if (pickupObject) {
                pickupObject.parent.remove(pickupObject);
            }

            // Remover marcador de entrega antigo
            if (deliveryNPC) {
                const oldMarker = deliveryNPC.mesh.getObjectByName('deliveryMarker');
                if (oldMarker) {
                    deliveryNPC.mesh.remove(oldMarker);
                }
            }

            hasObject = false;

            // Criar nova missão
            createMission();

            document.getElementById('status').textContent = 'Procure o objeto!';
        }

        // ==================== MINIMAP ====================
        function setupMinimap() {
            const minimapCanvas = document.getElementById('minimap');

            minimapRenderer = new THREE.WebGLRenderer({ alpha: true });
            minimapRenderer.setSize(200, 200);
            minimapCanvas.appendChild(minimapRenderer.domElement);

            minimapScene = new THREE.Scene();
            minimapCamera = new THREE.OrthographicCamera(-50, 50, 50, -50, 1, 200);
            minimapCamera.position.set(0, 100, 0);
            minimapCamera.lookAt(0, 0, 0);

            // Adicionar elementos ao minimap
            const groundMini = new THREE.Mesh(
                new THREE.PlaneGeometry(200, 200),
                new THREE.MeshBasicMaterial({ color: 0x228B22 })
            );
            groundMini.rotation.x = -Math.PI / 2;
            minimapScene.add(groundMini);

            // Ruas
            const streets = [-60, -30, 0, 30, 60];
            streets.forEach(pos => {
                const streetH = new THREE.Mesh(
                    new THREE.PlaneGeometry(200, 8),
                    new THREE.MeshBasicMaterial({ color: 0x333333 })
                );
                streetH.rotation.x = -Math.PI / 2;
                streetH.position.set(0, 0.1, pos);
                minimapScene.add(streetH);

                const streetV = new THREE.Mesh(
                    new THREE.PlaneGeometry(8, 200),
                    new THREE.MeshBasicMaterial({ color: 0x333333 })
                );
                streetV.rotation.x = -Math.PI / 2;
                streetV.position.set(pos, 0.1, 0);
                minimapScene.add(streetV);
            });

            // Prédios
            buildings.forEach(b => {
                const buildingMini = new THREE.Mesh(
                    new THREE.PlaneGeometry(b.width, b.depth),
                    new THREE.MeshBasicMaterial({ color: 0x666666 })
                );
                buildingMini.rotation.x = -Math.PI / 2;
                buildingMini.position.set(b.x, 0.2, b.z);
                minimapScene.add(buildingMini);
            });
        }

        function updateMinimap() {
            // Atualizar posição do jogador no minimap
            const existingPlayer = minimapScene.getObjectByName('playerMarker');
            if (existingPlayer) {
                minimapScene.remove(existingPlayer);
            }

            const playerMarker = new THREE.Mesh(
                new THREE.CircleGeometry(2, 8),
                new THREE.MeshBasicMaterial({ color: 0x0066ff })
            );
            playerMarker.rotation.x = -Math.PI / 2;
            playerMarker.position.set(player.position.x, 0.3, player.position.z);
            playerMarker.name = 'playerMarker';
            minimapScene.add(playerMarker);

            // Direção do jogador
            const directionLine = new THREE.Mesh(
                new THREE.PlaneGeometry(0.5, 3),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            directionLine.rotation.x = -Math.PI / 2;
            directionLine.rotation.z = -player.rotation;
            directionLine.position.set(player.position.x, 0.31, player.position.z);
            directionLine.name = 'playerMarker';
            minimapScene.add(directionLine);

            // Marcador de coleta
            const existingPickup = minimapScene.getObjectByName('pickupMarker');
            if (existingPickup) {
                minimapScene.remove(existingPickup);
            }

            if (!hasObject && pickupNPC) {
                const pickupMarker = new THREE.Mesh(
                    new THREE.CircleGeometry(1.5, 8),
                    new THREE.MeshBasicMaterial({ color: 0xffff00 })
                );
                pickupMarker.rotation.x = -Math.PI / 2;
                pickupMarker.position.set(pickupNPC.mesh.position.x, 0.4, pickupNPC.mesh.position.z);
                pickupMarker.name = 'pickupMarker';
                minimapScene.add(pickupMarker);
            }

            // Marcador de entrega
            const existingDelivery = minimapScene.getObjectByName('deliveryMarker2');
            if (existingDelivery) {
                minimapScene.remove(existingDelivery);
            }

            if (hasObject && deliveryNPC) {
                const deliveryMarker = new THREE.Mesh(
                    new THREE.CircleGeometry(1.5, 8),
                    new THREE.MeshBasicMaterial({ color: 0x00ff00 })
                );
                deliveryMarker.rotation.x = -Math.PI / 2;
                deliveryMarker.position.set(deliveryNPC.mesh.position.x, 0.4, deliveryNPC.mesh.position.z);
                deliveryMarker.name = 'deliveryMarker2';
                minimapScene.add(deliveryMarker);
            }

            // Rotacionar câmera do minimap com o jogador
            minimapCamera.position.set(
                player.position.x,
                100,
                player.position.z
            );
            minimapCamera.rotation.z = player.rotation;

            minimapRenderer.render(minimapScene, minimapCamera);
        }

        // ==================== CONTROLES ====================
        function requestPointerLock() {
            renderer.domElement.requestPointerLock();
        }

        function onPointerLockChange() {
            isPointerLocked = document.pointerLockElement === renderer.domElement;
        }

        function onKeyDown(e) {
            keys[e.key.toLowerCase()] = true;

            if (e.key === ' ') {
                e.preventDefault();
                tryEnterExitCar();
            }

            if (e.key.toLowerCase() === 'v' && isInCar) {
                e.preventDefault();
                carInternalView = !carInternalView;
                showMessage(carInternalView ? 'Visão Interna' : 'Visão Externa');
            }

            if (e.key.toLowerCase() === 'e') {
                e.preventDefault();
                shoot();
            }
        }

        function onKeyUp(e) {
            keys[e.key.toLowerCase()] = false;
        }

        function onMouseMove(e) {
            if (isPointerLocked) {
                mouseX -= e.movementX * 0.002; // Invertido para corrigir direção
                mouseY -= e.movementY * 0.002;
                mouseY = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, mouseY));
            }
        }

        function onMouseClick(e) {
            if (isPointerLocked && e.button === 0) {
                shoot();
            }
        }

        function onMouseWheel(e) {
            e.preventDefault();
            cameraDistance += e.deltaY * 0.01;
            cameraDistance = Math.max(5, Math.min(30, cameraDistance));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==================== ENTRAR/SAIR DO CARRO ====================
        function tryEnterExitCar() {
            if (isInCar) {
                // Sair do carro
                isInCar = false;
                carSpeed = 0;
                currentCar = null;
                playerVoxel.visible = true;
                document.getElementById('carStatus').style.display = 'none';
                document.getElementById('speedometer').style.display = 'none';
                showMessage('Saiu do carro');
            } else {
                // Tentar entrar em um carro próximo
                for (let car of cars) {
                    if (car.exploded) continue;
                    const distance = player.position.distanceTo(car.mesh.position);
                    if (distance < 5) {
                        isInCar = true;
                        currentCar = car;
                        playerVoxel.visible = false;
                        player.position.copy(car.mesh.position);
                        document.getElementById('carStatus').style.display = 'block';
                        document.getElementById('speedometer').style.display = 'block';
                        showMessage('Entrou no carro');
                        return;
                    }
                }
            }
        }

        // ==================== SISTEMA DE TIRO ====================
        function shoot() {
            const bullet = new THREE.Mesh(
                new THREE.SphereGeometry(0.3, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xffff00 })
            );

            bullet.position.copy(player.position);
            bullet.position.y = 3;

            const direction = new THREE.Vector3(
                -Math.sin(mouseX),
                Math.sin(mouseY),
                -Math.cos(mouseX)
            );

            scene.add(bullet);

            bullets.push({
                mesh: bullet,
                velocity: direction.multiplyScalar(2),
                life: 100
            });

            // Som de tiro (visual feedback)
            showMessage('BANG!');
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];

                bullet.mesh.position.add(bullet.velocity);
                bullet.life--;

                // Verificar colisão com NPCs
                for (let j = npcs.length - 1; j >= 0; j--) {
                    const npc = npcs[j];
                    if (npc.exploded) continue;

                    const dist = bullet.mesh.position.distanceTo(npc.mesh.position);
                    if (dist < 2) {
                        createExplosion(npc.mesh.position);
                        npc.exploded = true;
                        scene.remove(npc.mesh);
                        npcs.splice(j, 1);
                        scene.remove(bullet.mesh);
                        bullets.splice(i, 1);
                        break;
                    }
                }

                // Verificar colisão com carros
                for (let j = cars.length - 1; j >= 0; j--) {
                    const car = cars[j];
                    if (car === currentCar || car.exploded) continue;

                    const dist = bullet.mesh.position.distanceTo(car.mesh.position);
                    if (dist < 3) {
                        createExplosion(car.mesh.position);
                        car.exploded = true;
                        scene.remove(car.mesh);
                        scene.remove(bullet.mesh);
                        bullets.splice(i, 1);
                        break;
                    }
                }

                // Remover balas antigas
                if (bullet.life <= 0) {
                    scene.remove(bullet.mesh);
                    bullets.splice(i, 1);
                }
            }
        }

        // ==================== SISTEMA DE EXPLOSÃO ====================
        function createExplosion(position) {
            const particleCount = 20;
            const particles = [];

            for (let i = 0; i < particleCount; i++) {
                const particle = new THREE.Mesh(
                    new THREE.BoxGeometry(0.5, 0.5, 0.5),
                    new THREE.MeshBasicMaterial({
                        color: Math.random() > 0.5 ? 0xff6600 : 0xffff00
                    })
                );

                particle.position.copy(position);
                scene.add(particle);

                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    Math.random() * 0.5,
                    (Math.random() - 0.5) * 0.5
                );

                particles.push({
                    mesh: particle,
                    velocity: velocity,
                    life: 30
                });
            }

            explosions.push(...particles);
        }

        function updateExplosions() {
            for (let i = explosions.length - 1; i >= 0; i--) {
                const explosion = explosions[i];

                explosion.mesh.position.add(explosion.velocity);
                explosion.velocity.y -= 0.02; // Gravidade
                explosion.life--;

                explosion.mesh.material.opacity = explosion.life / 30;
                explosion.mesh.material.transparent = true;

                if (explosion.life <= 0) {
                    scene.remove(explosion.mesh);
                    explosions.splice(i, 1);
                }
            }
        }

        // ==================== ATUALIZAÇÃO ====================
        function updatePlayer() {
            if (!gameActive) return;

            let moveSpeed = isInCar ? 0.3 : player.speed;
            let moving = false;

            // Calcular aceleração do carro
            if (isInCar) {
                if (keys['w']) {
                    carSpeed = Math.min(carSpeed + 0.02, 1.2);
                    moving = true;
                } else if (keys['s']) {
                    carSpeed = Math.max(carSpeed - 0.02, -0.6);
                    moving = true;
                } else {
                    carSpeed *= 0.95; // Desaceleração
                }

                // Rotação do carro com A/D
                if (keys['a']) {
                    mouseX -= 0.03; // Virar para a esquerda
                }
                if (keys['d']) {
                    mouseX += 0.03; // Virar para a direita
                }

                moveSpeed = carSpeed; // Usar velocidade com direção

                // Atualizar velocímetro
                const speedKmh = Math.floor(Math.abs(carSpeed) * 100);
                document.getElementById('speed').textContent = speedKmh;

                const needleRotation = -135 + (speedKmh / 120) * 270;
                document.getElementById('needle').style.transform = `translateX(-50%) rotate(${needleRotation}deg)`;
            }

            const oldPosition = player.position.clone();

            if (isInCar) {
                // Controle do carro (apenas W/S movem)
                if (keys['w'] || keys['s']) {
                    player.position.x -= Math.sin(mouseX) * moveSpeed;
                    player.position.z -= Math.cos(mouseX) * moveSpeed;
                }
            } else {
                // Controle do jogador a pé
                if (keys['w']) {
                    player.position.x -= Math.sin(mouseX) * moveSpeed;
                    player.position.z -= Math.cos(mouseX) * moveSpeed;
                    moving = true;
                }
                if (keys['s']) {
                    player.position.x += Math.sin(mouseX) * moveSpeed;
                    player.position.z += Math.cos(mouseX) * moveSpeed;
                    moving = true;
                }
                if (keys['a']) {
                    player.position.x -= Math.cos(mouseX) * moveSpeed;
                    player.position.z += Math.sin(mouseX) * moveSpeed;
                    moving = true;
                }
                if (keys['d']) {
                    player.position.x += Math.cos(mouseX) * moveSpeed;
                    player.position.z -= Math.sin(mouseX) * moveSpeed;
                    moving = true;
                }
            }

            // Limitar área de movimento
            player.position.x = Math.max(-95, Math.min(95, player.position.x));
            player.position.z = Math.max(-95, Math.min(95, player.position.z));

            // Verificar atropelamento (apenas quando no carro)
            if (isInCar) {
                for (let i = npcs.length - 1; i >= 0; i--) {
                    const npc = npcs[i];
                    if (npc.exploded) continue;

                    const dist = player.position.distanceTo(npc.mesh.position);
                    if (dist < 2) {
                        createExplosion(npc.mesh.position);
                        npc.exploded = true;
                        scene.remove(npc.mesh);
                        npcs.splice(i, 1);
                    }
                }

                // Verificar colisão com outros carros
                for (let i = 0; i < cars.length; i++) {
                    const car = cars[i];
                    if (car === currentCar || car.exploded) continue;

                    const dist = player.position.distanceTo(car.mesh.position);
                    if (dist < 4) {
                        createExplosion(car.mesh.position);
                        car.exploded = true;
                        scene.remove(car.mesh);
                    }
                }
            }

            // Atualizar rotação do jogador
            player.rotation = mouseX;

            if (!isInCar) {
                playerVoxel.position.copy(player.position);
                playerVoxel.rotation.y = mouseX;

                // Animação de caminhada
                if (moving) {
                    player.walkAnimation += 0.15;

                    const leftArm = playerVoxel.getObjectByName('leftArm');
                    const rightArm = playerVoxel.getObjectByName('rightArm');
                    const leftLeg = playerVoxel.getObjectByName('leftLeg');
                    const rightLeg = playerVoxel.getObjectByName('rightLeg');

                    if (leftArm) leftArm.rotation.x = Math.sin(player.walkAnimation) * 0.5;
                    if (rightArm) rightArm.rotation.x = Math.sin(player.walkAnimation + Math.PI) * 0.5;
                    if (leftLeg) leftLeg.rotation.x = Math.sin(player.walkAnimation + Math.PI) * 0.5;
                    if (rightLeg) rightLeg.rotation.x = Math.sin(player.walkAnimation) * 0.5;
                }
            } else if (currentCar) {
                currentCar.mesh.position.copy(player.position);
                currentCar.mesh.rotation.y = mouseX;
            }

            // Verificar coleta/entrega
            checkMissionProgress();
        }

        function updateNPCs() {
            npcs.forEach(npc => {
                if (npc.forward) {
                    npc.progress += npc.speed;
                    if (npc.progress >= 1) {
                        npc.progress = 1;
                        npc.forward = false;
                    }
                } else {
                    npc.progress -= npc.speed;
                    if (npc.progress <= 0) {
                        npc.progress = 0;
                        npc.forward = true;
                    }
                }

                const x = npc.path.start.x + (npc.path.end.x - npc.path.start.x) * npc.progress;
                const z = npc.path.start.z + (npc.path.end.z - npc.path.start.z) * npc.progress;

                npc.mesh.position.set(x, 0, z);

                // Rotação
                if (npc.path.end.x !== npc.path.start.x) {
                    npc.mesh.rotation.y = npc.forward ? -Math.PI / 2 : Math.PI / 2;
                } else {
                    npc.mesh.rotation.y = npc.forward ? 0 : Math.PI;
                }

                // Animação de caminhada
                npc.walkAnimation += 0.1;

                const leftArm = npc.mesh.getObjectByName('leftArm');
                const rightArm = npc.mesh.getObjectByName('rightArm');
                const leftLeg = npc.mesh.getObjectByName('leftLeg');
                const rightLeg = npc.mesh.getObjectByName('rightLeg');

                if (leftArm) leftArm.rotation.x = Math.sin(npc.walkAnimation) * 0.4;
                if (rightArm) rightArm.rotation.x = Math.sin(npc.walkAnimation + Math.PI) * 0.4;
                if (leftLeg) leftLeg.rotation.x = Math.sin(npc.walkAnimation + Math.PI) * 0.4;
                if (rightLeg) rightLeg.rotation.x = Math.sin(npc.walkAnimation) * 0.4;
            });
        }

        function updateCars() {
            cars.forEach(car => {
                if (car === currentCar) return;

                if (car.waiting) {
                    car.waitTime++;
                    if (car.waitTime > 180) { // ~3 segundos
                        car.waiting = false;
                        car.waitTime = 0;
                    }
                    return;
                }

                // Verificar semáforo próximo
                let shouldStop = false;
                trafficLights.forEach(light => {
                    const dist = Math.abs(car.mesh.position.x - light.x) + Math.abs(car.mesh.position.z - light.z);
                    if (dist < 15 && light.state === 'red') {
                        shouldStop = true;
                    }
                });

                if (shouldStop) {
                    car.waiting = true;
                    return;
                }

                car.progress += car.speed;

                if (car.progress >= 1) {
                    car.progress = 0;
                }

                const x = car.path.start.x + (car.path.end.x - car.path.start.x) * car.progress;
                const z = car.path.start.z + (car.path.end.z - car.path.start.z) * car.progress;

                car.mesh.position.set(x, 0, z);
            });
        }

        function updateTrafficLights() {
            trafficLights.forEach(light => {
                light.timer++;

                if (light.timer > 300) { // ~5 segundos
                    light.timer = 0;
                    light.state = light.state === 'red' ? 'green' : 'red';
                }

                const redLight = light.mesh.getObjectByName('red');
                const greenLight = light.mesh.getObjectByName('green');

                if (redLight) {
                    redLight.material.color.setHex(light.state === 'red' ? 0xff0000 : 0x440000);
                    redLight.material.emissive.setHex(light.state === 'red' ? 0xff0000 : 0x000000);
                    redLight.material.emissiveIntensity = light.state === 'red' ? 0.8 : 0;
                }

                if (greenLight) {
                    greenLight.material.color.setHex(light.state === 'green' ? 0x00ff00 : 0x004400);
                    greenLight.material.emissive.setHex(light.state === 'green' ? 0x00ff00 : 0x000000);
                    greenLight.material.emissiveIntensity = light.state === 'green' ? 0.8 : 0;
                }
            });
        }

        function updateDayNightCycle() {
            dayNightCycle += 0.001;

            const dayTime = Math.sin(dayNightCycle);

            // Obter luz ambiente
            const ambientLight = scene.getObjectByName('ambientLight');

            // Ajustar cor do céu
            if (dayTime > 0) {
                // Dia
                scene.fog.color.setHex(0x87CEEB);
                scene.background = new THREE.Color(0x87CEEB);
                sun.intensity = 0.8;
                moon.intensity = 0;
                if (ambientLight) ambientLight.intensity = 0.7;
            } else {
                // Noite
                const nightness = Math.abs(dayTime);
                scene.fog.color.lerpColors(
                    new THREE.Color(0x87CEEB),
                    new THREE.Color(0x001133),
                    nightness
                );
                scene.background = new THREE.Color().lerpColors(
                    new THREE.Color(0x87CEEB),
                    new THREE.Color(0x001133),
                    nightness
                );
                sun.intensity = 0;
                moon.intensity = 0.3;
                if (ambientLight) ambientLight.intensity = 0.5; // Reduzir à noite
            }

            // Iluminar postes à noite
            streetLights.forEach(light => {
                const lamp = light.getObjectByName('lamp');
                if (lamp) {
                    lamp.material.emissiveIntensity = dayTime < 0 ? 0.8 : 0;
                }
            });
        }

        function checkMissionProgress() {
            if (!hasObject && pickupNPC) {
                const distance = player.position.distanceTo(pickupNPC.mesh.position);
                if (distance < 3) {
                    hasObject = true;
                    pickupNPC.mesh.remove(pickupObject);

                    // Adicionar objeto ao jogador
                    pickupObject.position.set(0, 5, 0);
                    playerVoxel.add(pickupObject);

                    document.getElementById('status').textContent = 'Entregue para a pessoa marcada!';
                    showMessage('Objeto coletado! Entregue para a pessoa verde.');
                }
            } else if (hasObject && deliveryNPC) {
                const distance = player.position.distanceTo(deliveryNPC.mesh.position);
                if (distance < 3) {
                    score += 10;
                    document.getElementById('score').textContent = score;
                    timeLeft += 30; // Bônus de tempo
                    showMessage('+10 pontos! +30 segundos!');
                    nextMission();
                }
            }
        }

        function updateTimer() {
            if (!gameActive) return;

            timeLeft--;
            document.getElementById('timer').textContent = timeLeft;

            if (timeLeft <= 0) {
                gameActive = false;
                showMessage('Tempo esgotado! Pontuação final: ' + score, true);
            }
        }

        function showMessage(text, permanent = false) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.display = 'block';

            if (!permanent) {
                setTimeout(() => {
                    msg.style.display = 'none';
                }, 2000);
            }
        }

        function updateCamera() {
            if (isInCar) {
                const carPos = currentCar.mesh.position;
                const carRot = currentCar.mesh.rotation.y;

                if (carInternalView) {
                    // Visão interna do carro
                    camera.position.x = carPos.x - Math.sin(carRot) * 2;
                    camera.position.y = carPos.y + 3;
                    camera.position.z = carPos.z - Math.cos(carRot) * 2;

                    camera.lookAt(
                        carPos.x - Math.sin(carRot) * 10,
                        carPos.y + 2,
                        carPos.z - Math.cos(carRot) * 10
                    );
                } else {
                    // Visão externa do carro (terceira pessoa)
                    const targetX = carPos.x + Math.sin(carRot) * 15;
                    const targetY = carPos.y + 10;
                    const targetZ = carPos.z + Math.cos(carRot) * 15;

                    camera.position.x = targetX;
                    camera.position.y = targetY;
                    camera.position.z = targetZ;

                    camera.lookAt(carPos.x, carPos.y + 2, carPos.z);
                }
            } else {
                // Câmera terceira pessoa
                const targetX = player.position.x + Math.sin(mouseX) * cameraDistance;
                const targetY = player.position.y + cameraHeight + Math.sin(mouseY) * 5;
                const targetZ = player.position.z + Math.cos(mouseX) * cameraDistance;

                camera.position.x = targetX;
                camera.position.y = targetY;
                camera.position.z = targetZ;

                camera.lookAt(player.position.x, player.position.y + 3, player.position.z);
            }
        }

        // ==================== LOOP DE ANIMAÇÃO ====================
        function animate() {
            requestAnimationFrame(animate);

            updatePlayer();
            updateNPCs();
            updateCars();
            updateTrafficLights();
            updateDayNightCycle();
            updateBullets();
            updateExplosions();
            updateCamera();
            updateMinimap();

            renderer.render(scene, camera);
        }

        // ==================== INICIAR JOGO ====================
        init();
    </script>
</body>
</html>
